[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membuddy"
version = "0.1.0"
description = "Local-first, cross-agent lessons and preferences"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3,<7",
    "mcp>=1.12,<2",
]

[project.scripts]
membuddy = "membuddy.cli:main"

[tool.setuptools.packages.find]
include = ["membuddy*"]

[tool.setuptools.package-data]
membuddy = ["assets/*/SKILL.md", "assets/*.md"]
